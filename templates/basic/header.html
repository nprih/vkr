<header class="header">
    <div class="header-inner">
        <div class="logo" title="На главную">
            <span class="logo-icon">📷</span> Фото Банк
        </div>
        <nav class="nav" id="navLinks">
            <a href="/"><button class="nav-link">🏠 Главная</button></a>

            {{if .is_admin}}
                <a href="/admin"><button class="nav-link">⚙️ Админ-панель</button></a>
            {{end}}

            {{if .is_login}}
                <a href="/profile"><button class="nav-link">👤 Профиль</button></a>
                <a href="#"><button class="nav-link danger logout">🚪 Выйти</button></a>
                <span class="user-badge">{{ .login}}</span>
            {{end}}

            {{if not .is_login}}
                <a href="/login"><button class="nav-link">🔑 Войти</button></a>
                <a href="/register"><button class="nav-link">📝 Регистрация</button></a>
            {{end}}

        </nav>
    </div>
</header>
